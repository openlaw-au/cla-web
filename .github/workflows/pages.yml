name: pages
# Build & deploy the public CLQ site to GitHub Pages (JAM-6940).
# Pulls the built issue PDFs and the cumulative index/archive from openlaw-au/cla-clq,
# generates the landing page from site/issues.json, and publishes dist/ to Pages.
#
# Setup: enable Pages (Settings → Pages → Source: GitHub Actions) and add a CLQ_REPO_TOKEN
# secret (a fine-grained PAT with read access to cla-clq) so the PDFs + index can be fetched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cla-web
        uses: actions/checkout@v4

      - name: Checkout cla-clq (index + issue PDFs)
        uses: actions/checkout@v4
        with:
          repository: openlaw-au/cla-clq
          token: ${{ secrets.CLQ_REPO_TOKEN }}
          path: _clq

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Assemble site data + issue PDFs from cla-clq
        run: |
          mkdir -p site/data dist/issues
          # cumulative index (for per-issue article lists) + the searchable archive page
          cp _clq/index/all_index.json site/data/all_index.json || echo "::warning::all_index.json not found in cla-clq"
          cp _clq/index/clq_archive.html dist/archive.html || echo "::warning::clq_archive.html not found in cla-clq"
          # copy each published issue's press PDF to the path issues.json references
          python3 - <<'PY'
          import json, glob, shutil, pathlib
          m = json.load(open("site/issues.json"))
          for it in m.get("issues", []):
              folder = it.get("clq_folder"); dest = it.get("pdf")
              if not folder or not dest: continue
              src = sorted(glob.glob(f"_clq/issues/{folder}/pdf/*.pdf"))
              if not src:
                  print(f"::warning::no PDF for {folder}"); continue
              pathlib.Path("dist", dest).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(src[0], pathlib.Path("dist", dest))
              print("copied", src[0], "->", dest)
          PY

      - name: Build site
        run: python3 site/build-site.py --out dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
