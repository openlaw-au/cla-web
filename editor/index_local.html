<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLQ Proofing Editor — v0</title>
<style>
  :root{ --navy:#1B365D; --steel:#55708E; --mist:#8A97A5; --ink:#232323; --line:#e5e7eb; --bg:#faf9f7; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header{ padding:10px 16px; border-bottom:1px solid var(--line); background:#fff; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1{ font-size:14px; margin:0; color:var(--navy); letter-spacing:.02em; }
  header .muted{ color:var(--mist); font-size:12px; }
  .toolbar{ display:flex; gap:4px; flex-wrap:wrap; padding:8px 16px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:5; }
  .toolbar button{ font:13px/1 inherit; padding:6px 9px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; color:var(--ink); }
  .toolbar button:hover{ border-color:var(--steel); color:var(--navy); }
  .toolbar .sep{ width:1px; background:var(--line); margin:2px 4px; }
  main{ display:grid; grid-template-columns: 1fr 360px; gap:0; min-height:calc(100vh - 96px); }
  @media (max-width:860px){ main{ grid-template-columns:1fr; } }
  #editorWrap{ padding:24px; overflow:auto; }
  .ProseMirror{ max-width:44rem; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:10px; padding:32px 36px; min-height:70vh; outline:none; font-family:"EB Garamond",Georgia,serif; font-size:17px; line-height:1.55; }
  .ProseMirror:focus{ border-color:var(--steel); }
  .ProseMirror h1{ font-size:1.5em; color:var(--navy); } .ProseMirror h2{ font-size:1.25em; color:var(--navy);} .ProseMirror h3{ font-size:1.08em; color:var(--navy); }
  .ProseMirror blockquote{ border-left:3px solid var(--mist); margin:1em 0; padding-left:1em; color:#444; }
  .ProseMirror em{ font-style:italic; }
  sup.clq-fn{ color:#fff; background:var(--navy); border-radius:4px; padding:0 4px; font-size:.62em; cursor:pointer; font-family:-apple-system,sans-serif; vertical-align:super; }
  sup.clq-fn.sel{ outline:2px solid var(--steel); }
  aside{ border-left:1px solid var(--line); background:#fff; padding:16px; overflow:auto; }
  aside h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--steel); margin:0 0 8px; }
  aside textarea{ width:100%; min-height:120px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; border:1px solid var(--line); border-radius:8px; padding:10px; resize:vertical; }
  aside .hint{ color:var(--mist); font-size:12px; margin-top:6px; }
  .io{ margin-top:18px; } .io textarea{ min-height:160px; }
  .row{ display:flex; gap:8px; margin-top:8px; }
  .row button{ flex:1; padding:8px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  .row button.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .status{ font-size:12px; color:var(--mist); padding:4px 16px; }
</style>
</head>
<body>
<header>
  <h1>CLQ Proofing Editor</h1>
  <span class="muted">v0 — round-trips Markdown (headings · italics · bold · quotes · lists · footnotes). Press build stays in CI.</span>
</header>
<div class="toolbar" id="toolbar"></div>
<main>
  <div id="editorWrap"><div id="editor"></div></div>
  <aside>
    <h2>Selected footnote</h2>
    <textarea id="fnText" placeholder="Select a footnote (the navy superscript) to edit its text here. Markdown allowed — e.g. *Case v Name* (2025) 1 CLR 1."></textarea>
    <div class="hint">Footnotes export as pandoc inline notes <code>^[…]</code>, which the LaTeX pipeline turns into <code>\footnote{…}</code>.</div>

    <div class="io">
      <h2>Markdown in / out</h2>
      <textarea id="mdio" placeholder="Paste an article's Markdown here and press Load. Reference footnotes [^1] and inline ^[…] are both supported on load."></textarea>
      <div class="row">
        <button id="load">Load into editor ▸</button>
        <button id="export" class="primary">◂ Export Markdown</button>
      </div>
      <div class="row"><button id="download">Download .md</button></div>
    </div>
  </aside>
</main>
<div class="status" id="status">Loading editor…</div>

<script type="module" src="bundle.js"></script>
</body>
</html>
